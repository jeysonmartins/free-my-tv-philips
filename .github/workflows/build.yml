name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create config and Build APK
        run: |
          touch config.properties
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Philips-BR
          path: "*.apk"
